[package]
name = "lynx"
version = "0.1.0"
edition = "2021"
description = "Lynx — local-first CLI coding agent (llama.cpp + Qwen2.5-Coder-7B abliterated Q4_K_M)"

[[bin]]
name = "lynx"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
inquire = "0.7"
console = "0.15"
indicatif = "0.17"
regex = "1"
walkdir = "2"
ignore = "0.4"
similar = "2"
chrono = "0.4"
dirs = "5"
toml = "0.8"
futures-util = "0.3"
pulldown-cmark = "0.12"
terminal-light = "1"
textwrap = "0.16"

[dev-dependencies]
tempfile = "3"

